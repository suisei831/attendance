    .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--plum-700); color:#fff; padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600; z-index:60; box-shadow:var(--shadow); animation:fade .2s ease; }
